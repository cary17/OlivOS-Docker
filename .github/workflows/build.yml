name: Build and Push Docker Image

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build stable and testing releases without updating build-record.json'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: olivos-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      stable_raw_version: ${{ steps.release.outputs.stable_raw_version }}
      stable_docker_tag: ${{ steps.release.outputs.stable_docker_tag }}
      stable_published_at: ${{ steps.release.outputs.stable_published_at }}
      stable_should_build: ${{ steps.release.outputs.stable_should_build }}
      stable_full_only: ${{ steps.release.outputs.stable_full_only }}
      testing_raw_version: ${{ steps.release.outputs.testing_raw_version }}
      testing_docker_tag: ${{ steps.release.outputs.testing_docker_tag }}
      testing_published_at: ${{ steps.release.outputs.testing_published_at }}
      testing_should_build: ${{ steps.release.outputs.testing_should_build }}
      testing_full_only: ${{ steps.release.outputs.testing_full_only }}
      any_should_build: ${{ steps.release.outputs.any_should_build }}
      dockerhub_enabled: ${{ steps.dockerhub_check.outputs.enabled }}
      force_build: ${{ steps.force.outputs.enabled }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit and syntax tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q download_plugins.py scripts tests
          sh -n entrypoint.sh download_source.sh
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.extra.yml config --quiet
          docker build \
            --build-arg BASE_IMAGE=ghcr.io/cary17/olivos:latest \
            --tag olivos-derived-ci:test \
            --file Dockerfile.extra \
            .

      - name: Resolve force build flag
        id: force
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_build }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect latest OlivOS releases
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_ARG=""
          if [ "${{ steps.force.outputs.enabled }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python3 scripts/build_metadata.py detect --record build-record.json $FORCE_ARG

      - name: Check Docker Hub secrets
        id: dockerhub_check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub is enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub is disabled (secrets not found)"
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.any_should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, testing]
        build_type: [core, dev, full]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check channel build requirement
        id: channel
        run: |
          if [ "${{ matrix.channel }}" = "stable" ]; then
            SHOULD_BUILD="${{ needs.check.outputs.stable_should_build }}"
            FULL_ONLY="${{ needs.check.outputs.stable_full_only }}"
          else
            SHOULD_BUILD="${{ needs.check.outputs.testing_should_build }}"
            FULL_ONLY="${{ needs.check.outputs.testing_full_only }}"
          fi
          if [ "${FULL_ONLY}" = "true" ] && [ "${{ matrix.build_type }}" != "full" ]; then
            SHOULD_BUILD="false"
          fi
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.channel.outputs.should_build == 'true'
        uses: actions/checkout@v4

      - name: Prepare build metadata
        if: steps.channel.outputs.should_build == 'true'
        id: meta
        env:
          DOCKERHUB_ENABLED: ${{ needs.check.outputs.dockerhub_enabled }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          REPO_OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.channel }}" = "stable" ]; then
            RAW_VERSION="${{ needs.check.outputs.stable_raw_version }}"
            BASE_TAG="${{ needs.check.outputs.stable_docker_tag }}"
            MOVING_TAG="latest"
          else
            RAW_VERSION="${{ needs.check.outputs.testing_raw_version }}"
            BASE_TAG="${{ needs.check.outputs.testing_docker_tag }}"
            MOVING_TAG="testing"
          fi

          case "${{ matrix.build_type }}" in
            full)
              VERSION_TAG="${BASE_TAG}"
              CHANNEL_TAG="${MOVING_TAG}"
              ;;
            core)
              VERSION_TAG="${BASE_TAG}-core"
              CHANNEL_TAG="${MOVING_TAG}-core"
              ;;
            dev)
              VERSION_TAG="${BASE_TAG}-dev"
              CHANNEL_TAG="${MOVING_TAG}-dev"
              ;;
          esac

          echo "raw_version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_type=${{ matrix.build_type }}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${REPO_OWNER_LC}/olivos:${VERSION_TAG}"
            echo "ghcr.io/${REPO_OWNER_LC}/olivos:${CHANNEL_TAG}"
            if [ "${DOCKERHUB_ENABLED}" = "true" ]; then
              echo "${DOCKERHUB_USERNAME}/olivos:${VERSION_TAG}"
              echo "${DOCKERHUB_USERNAME}/olivos:${CHANNEL_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.channel.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.channel.outputs.should_build == 'true' && needs.check.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.channel.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.channel.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.channel.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OLIVOS_RAW_VERSION=${{ steps.meta.outputs.raw_version }}
            BUILD_TYPE=${{ steps.meta.outputs.build_type }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify multi-arch manifest
        if: steps.channel.outputs.should_build == 'true'
        run: |
          TAGS='${{ steps.meta.outputs.tags }}'
          printf '%s\n' "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Verifying manifest: $tag"
            docker buildx imagetools inspect "$tag"
          done

  record:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.any_should_build == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect OPK plugin versions
        env:
          PLUGIN_DIR: ${{ runner.temp }}/olivos-opk
        run: |
          python3 download_plugins.py

      - name: Update local build record
        run: |
          FORCE_ARG=""
          if [ "${{ needs.check.outputs.force_build }}" = "true" ]; then
            FORCE_ARG="--force"
          fi

          if [ "${{ needs.check.outputs.stable_should_build }}" = "true" ]; then
            python3 scripts/build_metadata.py update-record \
              --record build-record.json \
              --channel stable \
              --raw-version "${{ needs.check.outputs.stable_raw_version }}" \
              --published-at "${{ needs.check.outputs.stable_published_at }}" \
              --plugins downloaded-plugins.json \
              $FORCE_ARG
          fi

          if [ "${{ needs.check.outputs.testing_should_build }}" = "true" ]; then
            python3 scripts/build_metadata.py update-record \
              --record build-record.json \
              --channel testing \
              --raw-version "${{ needs.check.outputs.testing_raw_version }}" \
              --published-at "${{ needs.check.outputs.testing_published_at }}" \
              --plugins downloaded-plugins.json \
              $FORCE_ARG
          fi

      - name: Commit build record
        if: needs.check.outputs.force_build != 'true'
        run: |
          if git diff --quiet -- build-record.json; then
            echo "No build record changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-record.json
          git commit -m "chore: record OlivOS Docker build"
          git pull --rebase
          git push
