name: Build and Push Docker Image

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      force_channel:
        description: 'Force build one release channel without updating build-record.json'
        required: false
        type: choice
        default: none
        options:
          - none
          - stable
          - testing
          - both

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: olivos-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      stable_raw_version: ${{ steps.release.outputs.stable_raw_version }}
      stable_docker_tag: ${{ steps.release.outputs.stable_docker_tag }}
      stable_published_at: ${{ steps.release.outputs.stable_published_at }}
      stable_should_build: ${{ steps.release.outputs.stable_should_build }}
      testing_raw_version: ${{ steps.release.outputs.testing_raw_version }}
      testing_docker_tag: ${{ steps.release.outputs.testing_docker_tag }}
      testing_published_at: ${{ steps.release.outputs.testing_published_at }}
      testing_should_build: ${{ steps.release.outputs.testing_should_build }}
      any_should_build: ${{ steps.release.outputs.any_should_build }}
      dockerhub_enabled: ${{ steps.dockerhub_check.outputs.enabled }}
      force_build: ${{ steps.force.outputs.enabled }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit and syntax tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q download_plugins.py scripts tests
          sh -n entrypoint.sh download_source.sh
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.extra.yml config --quiet

      - name: Resolve force build selection
        id: force
        run: |
          CHANNEL="none"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.force_channel }}"
          fi
          case "$CHANNEL" in
            none|stable|testing|both) ;;
            *) echo "Invalid force channel: $CHANNEL" >&2; exit 1 ;;
          esac
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = "none" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect latest OlivOS releases
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_metadata.py detect --record build-record.json
          if [ "${{ steps.force.outputs.enabled }}" = "true" ]; then
            case "${{ steps.force.outputs.channel }}" in
              stable)
                echo "stable_should_build=true" >> "$GITHUB_OUTPUT"
                echo "testing_should_build=false" >> "$GITHUB_OUTPUT"
                ;;
              testing)
                echo "stable_should_build=false" >> "$GITHUB_OUTPUT"
                echo "testing_should_build=true" >> "$GITHUB_OUTPUT"
                ;;
              both)
                echo "stable_should_build=true" >> "$GITHUB_OUTPUT"
                echo "testing_should_build=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
            echo "any_should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Docker Hub secrets
        id: dockerhub_check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub is enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub is disabled (secrets not found)"
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.any_should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, testing]
        build_type: [core, dev, full]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check channel build requirement
        id: channel
        run: |
          if [ "${{ matrix.channel }}" = "stable" ]; then
            SHOULD_BUILD="${{ needs.check.outputs.stable_should_build }}"
          else
            SHOULD_BUILD="${{ needs.check.outputs.testing_should_build }}"
          fi
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.channel.outputs.should_build == 'true'
        uses: actions/checkout@v4

      - name: Prepare build metadata
        if: steps.channel.outputs.should_build == 'true'
        id: meta
        env:
          DOCKERHUB_ENABLED: ${{ needs.check.outputs.dockerhub_enabled }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          REPO_OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.channel }}" = "stable" ]; then
            RAW_VERSION="${{ needs.check.outputs.stable_raw_version }}"
            BASE_TAG="${{ needs.check.outputs.stable_docker_tag }}"
            MOVING_TAG="latest"
          else
            RAW_VERSION="${{ needs.check.outputs.testing_raw_version }}"
            BASE_TAG="${{ needs.check.outputs.testing_docker_tag }}"
            MOVING_TAG="testing"
          fi

          case "${{ matrix.build_type }}" in
            full)
              VERSION_TAG="${BASE_TAG}"
              CHANNEL_TAG="${MOVING_TAG}"
              ;;
            core)
              VERSION_TAG="${BASE_TAG}-core"
              CHANNEL_TAG="${MOVING_TAG}-core"
              ;;
            dev)
              VERSION_TAG="${BASE_TAG}-dev"
              CHANNEL_TAG="${MOVING_TAG}-dev"
              ;;
          esac

          echo "raw_version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_type=${{ matrix.build_type }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO_OWNER_LC}/olivos" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${REPO_OWNER_LC}/olivos:${VERSION_TAG}"
            echo "ghcr.io/${REPO_OWNER_LC}/olivos:${CHANNEL_TAG}"
            if [ "${DOCKERHUB_ENABLED}" = "true" ]; then
              echo "${DOCKERHUB_USERNAME}/olivos:${VERSION_TAG}"
              echo "${DOCKERHUB_USERNAME}/olivos:${CHANNEL_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.channel.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.channel.outputs.should_build == 'true' && needs.check.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.channel.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.channel.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.channel.outputs.should_build == 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OLIVOS_RAW_VERSION=${{ steps.meta.outputs.raw_version }}
            BUILD_TYPE=${{ steps.meta.outputs.build_type }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          no-cache: ${{ needs.check.outputs.force_build == 'true' }}
          pull: ${{ needs.check.outputs.force_build == 'true' }}
          cache-from: type=gha,scope=${{ matrix.channel }}-${{ matrix.build_type }}
          cache-to: type=gha,mode=max,scope=${{ matrix.channel }}-${{ matrix.build_type }}

      - name: Verify multi-arch manifest
        if: steps.channel.outputs.should_build == 'true'
        run: |
          TAGS='${{ steps.meta.outputs.tags }}'
          printf '%s\n' "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Verifying manifest: $tag"
            docker buildx imagetools inspect "$tag"
          done

      - name: Verify and collect image plugin manifest
        if: steps.channel.outputs.should_build == 'true' && matrix.build_type == 'full'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.image.outputs.digest }}
        run: |
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" --entrypoint python "$IMAGE_REF" -c '
          import hashlib, json
          from pathlib import Path
          root = Path("/opt/olivos/plugins")
          text = (root / "manifest.json").read_text()
          plugins = json.loads(text)
          names = [plugin["name"] for plugin in plugins]
          assert len(names) == len(set(names)), "Duplicate plugin names"
          assert set(names) == {p.name for p in root.glob("*.opk")}, "Plugin inventory mismatch"
          for plugin in plugins:
              path = root / plugin["name"]
              with path.open("rb") as file:
                  assert hashlib.file_digest(file, "sha256").hexdigest() == plugin["sha256"], path
          print(text, end="")
          ' > "plugins-$arch.json"
          done
          cmp plugins-amd64.json plugins-arm64.json

      - name: Upload image plugin manifest
        if: steps.channel.outputs.should_build == 'true' && matrix.build_type == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.channel }}
          path: plugins-amd64.json
          if-no-files-found: error
          retention-days: 7

  record:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.any_should_build == 'true' && needs.check.outputs.force_build != 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image plugin manifests
        uses: actions/download-artifact@v4
        with:
          pattern: plugins-*
          path: manifests

      - name: Update local build record
        run: |
          if [ "${{ needs.check.outputs.stable_should_build }}" = "true" ]; then
            python3 scripts/build_metadata.py update-record \
              --record build-record.json \
              --channel stable \
              --raw-version "${{ needs.check.outputs.stable_raw_version }}" \
              --published-at "${{ needs.check.outputs.stable_published_at }}" \
              --plugins manifests/plugins-stable/plugins-amd64.json
          fi

          if [ "${{ needs.check.outputs.testing_should_build }}" = "true" ]; then
            python3 scripts/build_metadata.py update-record \
              --record build-record.json \
              --channel testing \
              --raw-version "${{ needs.check.outputs.testing_raw_version }}" \
              --published-at "${{ needs.check.outputs.testing_published_at }}" \
              --plugins manifests/plugins-testing/plugins-amd64.json
          fi

      - name: Commit build record
        run: |
          if git diff --quiet -- build-record.json; then
            echo "No build record changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-record.json
          git commit -m "chore: record OlivOS Docker build"
          git pull --rebase
          git push
